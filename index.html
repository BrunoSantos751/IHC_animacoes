<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento de Consulta</title>
  <style>
    :root {
      --dur: 300ms;
      /* alterado pelo seletor de duração */
      --shift: 12px;
      /* deslocamento do slide; vira 0 em "reduzir movimento" */
      --accent: #1d5fa8;
      --line: #cfd6dd;
      --bg: #f4f5f7;
      --error: #b3261e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      background: var(--bg);
    }

    .options {
      display: flex;
      gap: 24px;
      justify-content: center;
      padding: 10px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .options select {
      margin-left: 6px;
      padding: 3px;
    }

    .options .check input {
      margin-right: 4px;
    }

    main {
      max-width: 560px;
      margin: 32px auto;
      padding: 0 16px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 16px;
    }

    h2 {
      font-size: 18px;
      margin: 0 0 14px;
    }

    section {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 20px;
    }

    fieldset {
      border: 0;
      padding: 0;
      margin: 0 0 18px;
    }

    legend,
    label {
      font-size: 14px;
      font-weight: bold;
    }

    legend {
      padding: 0;
      margin-bottom: 8px;
    }

    /* ---------- horários ---------- */
    .slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .slot {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
      transition: border-color var(--dur) ease,
        background-color var(--dur) ease,
        transform var(--dur) ease;
    }

    .slot .name {
      font-weight: bold;
      font-size: 14px;
    }

    .slot .spec {
      font-size: 12px;
      color: #666;
    }

    .slot .time {
      font-size: 15px;
      margin-top: 4px;
      color: var(--accent);
    }

    .slot:hover {
      border-color: var(--accent);
    }

    .slot:active {
      transform: scale(0.96);
    }

    .slot.selected {
      border: 2px solid var(--accent);
      padding: 9px 11px;
      background: #eaf2fb;
    }

    .msg {
      font-size: 13px;
      min-height: 18px;
      margin: 6px 0 0;
      color: #444;
    }

    .msg.error {
      color: var(--error);
    }

    /* ---------- campo nome ---------- */
    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 9px 10px;
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    .field input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 0;
    }

    .field input.invalid {
      border-color: var(--error);
    }

    /* tremor no campo inválido */
    .field input.shake {
      animation: shake calc(var(--dur) + 150ms) ease;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20%,
      60% {
        transform: translateX(calc(var(--shift) * -0.5));
      }

      40%,
      80% {
        transform: translateX(calc(var(--shift) * 0.5));
      }
    }

    /* ---------- botões ---------- */
    button.primary,
    button.secondary {
      font: inherit;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      transition: transform var(--dur) ease, background-color var(--dur) ease;
    }

    button.primary {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent);
    }

    button.primary:hover {
      background: #164a85;
    }

    button.primary:active,
    button.secondary:active {
      transform: scale(0.97);
    }

    button.primary:disabled {
      background: #7d9cc0;
      border-color: #7d9cc0;
      cursor: wait;
      transform: none;
    }

    button.secondary {
      background: #fff;
      border: 1px solid var(--line);
      margin-top: 8px;
    }

    /* ---------- operação em andamento ---------- */
    .loading {
      margin-top: 16px;
    }

    .loading:not([hidden]) {
      animation: fade var(--dur) ease;
    }

    .bar {
      height: 8px;
      background: #e3e7ec;
      border-radius: 4px;
      overflow: hidden;
    }

    #barFill {
      width: 0;
      height: 100%;
      background: var(--accent);
      transition-property: width;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }

    #loadingText {
      font-size: 13px;
      margin: 6px 0 0;
    }

    /* ---------- resultado ---------- */
    #result:not([hidden]) {
      animation: fadeSlide calc(var(--dur) + 100ms) ease-out;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(var(--shift));
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    dl {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 6px 10px;
      margin: 16px 0;
      font-size: 14px;
    }

    dt {
      color: #666;
    }

    dd {
      margin: 0;
      font-weight: bold;
    }

    /* ---------- reduzir movimento ----------
   Remove deslocamentos, tremor e escala. Mantém apenas mudanças de
   cor/opacidade e os textos de estado, para a tarefa continuar clara. */
    body.reduced {
      --shift: 0px;
    }

    body.reduced .slot:active,
    body.reduced button.primary:active,
    body.reduced button.secondary:active {
      transform: none;
    }

    body.reduced .field input.shake {
      animation: none;
    }

    body.reduced #barFill {
      transition: none;
    }
  </style>
</head>

<body>

  <div class="options">
    <label>
      Duração das animações
      <select id="speed">
        <option value="150">Rápida (150 ms)</option>
        <option value="300" selected>Normal (300 ms)</option>
        <option value="1200">Lenta (1200 ms)</option>
      </select>
    </label>
    <label class="check">
      <input type="checkbox" id="reduceMotion">
      Reduzir movimento
    </label>
  </div>

  <main>
    <h1>Clínica Bem-Estar</h1>

    <section id="booking">
      <h2>Agendar consulta</h2>

      <form id="form" novalidate>
        <fieldset>
          <legend>1. Escolha o horário</legend>
          <div class="slots">
            <button type="button" class="slot" data-doctor="Izaac" data-spec="Cardiologia" data-time="09:00">
              <span class="name">Izaac</span>
              <span class="spec">Cardiologia</span>
              <span class="time">09:00</span>
            </button>
            <button type="button" class="slot" data-doctor="Cesar" data-spec="Clínica Médica" data-time="11:30">
              <span class="name">Cesar</span>
              <span class="spec">Clínica Médica</span>
              <span class="time">11:30</span>
            </button>
            <button type="button" class="slot" data-doctor="Icaro" data-spec="Dermatologia" data-time="14:15">
              <span class="name">Icaro</span>
              <span class="spec">Dermatologia</span>
              <span class="time">14:15</span>
            </button>
            <button type="button" class="slot" data-doctor="Marcos Vinícius" data-spec="Ortopedia" data-time="16:00">
              <span class="name">Marcos Vinícius</span>
              <span class="spec">Ortopedia</span>
              <span class="time">16:00</span>
            </button>
          </div>
          <p id="slotMsg" class="msg" aria-live="polite"></p>
        </fieldset>

        <div class="field">
          <label for="patient">2. Nome do paciente</label>
          <input type="text" id="patient" autocomplete="name">
          <p id="nameMsg" class="msg error" aria-live="polite"></p>
        </div>

        <button type="submit" id="confirm" class="primary">Confirmar agendamento</button>

        <div id="loading" class="loading" hidden>
          <div class="bar">
            <div id="barFill"></div>
          </div>
          <p id="loadingText">Enviando...</p>
        </div>
      </form>
    </section>

    <section id="result" hidden>
      <h2>Consulta agendada</h2>
      <p>O horário foi reservado.</p>
      <dl>
        <dt>Paciente</dt>
        <dd id="rPatient"></dd>
        <dt>Médico</dt>
        <dd id="rDoctor"></dd>
        <dt>Horário</dt>
        <dd id="rTime"></dd>
        <dt>Protocolo</dt>
        <dd id="rProtocol"></dd>
      </dl>
      <button type="button" id="again" class="secondary">Novo agendamento</button>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const form = $('form');
    const slots = document.querySelectorAll('.slot');
    const slotMsg = $('slotMsg');
    const patient = $('patient');
    const nameMsg = $('nameMsg');
    const confirmBtn = $('confirm');
    const loading = $('loading');
    const barFill = $('barFill');
    const loadingText = $('loadingText');
    const booking = $('booking');
    const result = $('result');

    let selected = null;
    let busy = false;

    /* Duração: o seletor altera a variável CSS e o tempo da "operação em andamento" */
    function loadTime() {
      const dur = parseInt($('speed').value, 10);
      return dur === 1200 ? 4000 : dur === 150 ? 1000 : 2000;
    }

    $('speed').addEventListener('change', (e) => {
      document.documentElement.style.setProperty('--dur', e.target.value + 'ms');
    });

    $('reduceMotion').addEventListener('change', (e) => {
      document.body.classList.toggle('reduced', e.target.checked);
    });

    /* 1. Ação realizada: o horário clicado muda de estado na hora */
    slots.forEach((btn) => {
      btn.addEventListener('click', () => {
        slots.forEach((b) => b.classList.remove('selected'));
        btn.classList.add('selected');
        selected = btn.dataset;
        slotMsg.textContent = `Selecionado: ${btn.dataset.doctor}, ${btn.dataset.time}`;
      });
    });

    patient.addEventListener('input', () => {
      patient.classList.remove('invalid');
      nameMsg.textContent = '';
    });

    function invalidName() {
      patient.classList.add('invalid');
      nameMsg.textContent = 'Digite o nome do paciente para continuar.';
      patient.classList.remove('shake');
      void patient.offsetWidth; // reinicia a animação
      patient.classList.add('shake');
      patient.focus();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (busy) return;

      if (!selected) {
        slotMsg.textContent = 'Escolha um horário antes de confirmar.';
        slotMsg.classList.add('error');
        return;
      }
      slotMsg.classList.remove('error');

      const name = patient.value.trim();
      if (name.length < 3) {
        invalidName();
        return;
      }

      start(name);
    });

    /* 2. Operação em andamento: botão bloqueado + barra de progresso */
    function start(name) {
      busy = true;
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Agendando...';
      loading.hidden = false;

      const total = loadTime();
      barFill.style.transitionDuration = '0ms';
      barFill.style.width = '0';
      void barFill.offsetWidth;
      barFill.style.transitionDuration = total + 'ms';
      barFill.style.width = '100%';

      // texto de estado para quem não depende do movimento
      loadingText.textContent = 'Reservando horário...';
      setTimeout(() => (loadingText.textContent = 'Quase pronto...'), total * 0.7);

      setTimeout(() => finish(name), total);
    }

    /* 3. Resultado: fade + slide curto, com os dados escritos na tela */
    function finish(name) {
      $('rPatient').textContent = name;
      $('rDoctor').textContent = `${selected.doctor} (${selected.spec})`;
      $('rTime').textContent = `Hoje, ${selected.time}`;
      $('rProtocol').textContent = '#' + Math.floor(100000 + Math.random() * 900000);

      booking.hidden = true;
      result.hidden = false;
    }

    $('again').addEventListener('click', () => {
      selected = null;
      busy = false;
      patient.value = '';
      slots.forEach((b) => b.classList.remove('selected'));
      slotMsg.textContent = '';
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Confirmar agendamento';
      loading.hidden = true;
      barFill.style.width = '0';
      result.hidden = true;
      booking.hidden = false;
    });
  </script>
</body>

</html>
